<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f4e8c">
  <title>報修登記</title>
  <meta name="description" content="提交報修，並查看最近登記的問題。">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="報修登記">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>報修登記</h1>
    <p>填寫下方表單送出報修，清單會顯示最近 20 筆。</p>
    <button id="install-btn" type="button" class="secondary install-btn" hidden>安裝到主畫面</button>
    <p id="offline-banner" class="offline-banner" role="status" hidden>目前離線：可以瀏覽頁面，但無法送出報修或更新清單。</p>
  </header>

  <main>
    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">新增報修</h2>
      <form id="repair-form" novalidate>
        <div class="field">
          <label for="reporter_name">報修人</label>
          <input id="reporter_name" name="reporter_name" type="text" maxlength="50" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="location">地點或部門</label>
          <input id="location" name="location" type="text" maxlength="100" required>
        </div>

        <div class="field">
          <label for="category">類別</label>
          <select id="category" name="category" required>
            <option value="" disabled selected>請選擇</option>
            <option value="設備">設備</option>
            <option value="網路">網路</option>
            <option value="環境">環境</option>
            <option value="其他">其他</option>
          </select>
        </div>

        <div class="field">
          <label for="description">問題說明</label>
          <textarea id="description" name="description" rows="4" maxlength="1000" required></textarea>
        </div>

        <fieldset class="field">
          <legend>緊急程度</legend>
          <div class="segmented">
            <label><input type="radio" name="urgency" value="低"><span>低</span></label>
            <label><input type="radio" name="urgency" value="中" checked><span>中</span></label>
            <label><input type="radio" name="urgency" value="高"><span>高</span></label>
          </div>
        </fieldset>

        <button id="submit-btn" type="submit">送出報修</button>
        <p id="form-message" class="message" role="status" aria-live="polite" hidden></p>
      </form>
    </section>

    <section class="card" aria-labelledby="list-title">
      <div class="list-head">
        <h2 id="list-title">最近報修</h2>
        <button id="refresh-btn" type="button" class="secondary">重新整理</button>
      </div>
      <p id="list-message" class="muted" aria-live="polite">載入中…</p>
      <ul id="repair-list" class="repair-list"></ul>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
