<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7a4a24">
  <title>老屋改造</title>
  <meta name="description" content="登記老屋改造工項，追蹤預算與施工狀態。">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="老屋改造">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <header class="site-header">
    <h1>老屋改造</h1>
    <p>逐項登記要做的工程，隨時掌握預算與施工狀態。</p>
    <button id="install-btn" type="button" class="secondary install-btn" hidden>安裝到主畫面</button>
    <p id="offline-banner" class="offline-banner" role="status" hidden>目前離線：可以瀏覽頁面，但無法新增工項或更新清單。</p>
  </header>

  <main>
    <section class="card" aria-labelledby="summary-title">
      <h2 id="summary-title">預算總覽</h2>
      <div class="stats">
        <div class="stat stat-wide">
          <span class="stat-label">預算合計</span>
          <span id="sum-budget" class="stat-value">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">工項數</span>
          <span id="sum-count" class="stat-value">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">規劃中</span>
          <span id="sum-planned" class="stat-value">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">施工中</span>
          <span id="sum-doing" class="stat-value">—</span>
        </div>
        <div class="stat">
          <span class="stat-label">已完成</span>
          <span id="sum-done" class="stat-value">—</span>
        </div>
      </div>
    </section>

    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">新增工項</h2>
      <form id="item-form" novalidate>
        <div class="field">
          <label for="title">工項名稱</label>
          <input id="title" name="title" type="text" maxlength="100" placeholder="例：浴室全室防水重做" required>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="space">空間</label>
            <select id="space" name="space" required>
              <option value="" disabled selected>請選擇</option>
              <option>客廳</option><option>餐廳</option><option>廚房</option>
              <option>浴室</option><option>臥室</option><option>陽台</option>
              <option>樓梯</option><option>屋頂</option><option>外牆</option>
              <option>全室</option><option>其他</option>
            </select>
          </div>
          <div class="field">
            <label for="trade">工種</label>
            <select id="trade" name="trade" required>
              <option value="" disabled selected>請選擇</option>
              <option>拆除</option><option>水電</option><option>泥作</option>
              <option>防水</option><option>木作</option><option>油漆</option>
              <option>門窗</option><option>鐵件</option><option>系統櫃</option>
              <option>其他</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="budget">預算（元）</label>
            <input id="budget" name="budget" type="text" inputmode="numeric" maxlength="12" placeholder="例：85000" required>
          </div>
          <div class="field">
            <label for="contractor">廠商（選填）</label>
            <input id="contractor" name="contractor" type="text" maxlength="100">
          </div>
        </div>

        <div class="field">
          <label for="note">說明（選填）</label>
          <textarea id="note" name="note" rows="3" maxlength="1000" placeholder="現況、做法、注意事項"></textarea>
        </div>

        <div class="field">
          <span class="field-label" id="photos-label">照片（選填，最多 6 張）</span>
          <label class="photo-pick secondary" for="photos">選擇照片</label>
          <input id="photos" name="photos" type="file" accept="image/*" multiple class="visually-hidden" aria-labelledby="photos-label">
          <div id="photo-preview" class="thumbs" aria-live="polite"></div>
        </div>

        <fieldset class="field">
          <legend>優先程度</legend>
          <div class="segmented">
            <label><input type="radio" name="priority" value="低"><span>低</span></label>
            <label><input type="radio" name="priority" value="中" checked><span>中</span></label>
            <label><input type="radio" name="priority" value="高"><span>高</span></label>
          </div>
        </fieldset>

        <div class="field">
          <label for="recorder_name">登記人</label>
          <input id="recorder_name" name="recorder_name" type="text" maxlength="50" autocomplete="name" required>
        </div>

        <button id="submit-btn" type="submit">新增工項</button>
        <p id="form-message" class="message" role="status" aria-live="polite" hidden></p>
      </form>
    </section>

    <section class="card" aria-labelledby="list-title">
      <div class="list-head">
        <h2 id="list-title">工項清單</h2>
        <button id="refresh-btn" type="button" class="secondary">重新整理</button>
      </div>
      <p id="list-message" class="muted" aria-live="polite">載入中…</p>
      <ul id="item-list" class="item-list"></ul>
      <input id="add-photo-input" type="file" accept="image/*" multiple class="visually-hidden" tabindex="-1" aria-hidden="true">
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
  <script src="config.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
